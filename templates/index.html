<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Игровой портал</title>
<style>
  body { font-family: system-ui, sans-serif; background: #101820; color: #eee;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
  .card { background: #1b2631; padding: 32px 36px; border-radius: 14px;
          box-shadow: 0 10px 40px rgba(0,0,0,.5); width: 380px; }
  h1 { margin: 0 0 18px; font-size: 22px; text-align: center; }
  label { display: block; font-size: 13px; opacity: .8; margin: 14px 0 4px; }
  input, select { width: 100%; padding: 10px 12px; border-radius: 8px;
                  border: 1px solid #34495e; background: #0e1621; color: #eee;
                  font-size: 15px; box-sizing: border-box; }
  input:focus, select:focus { outline: none; border-color: #4a9eff; }
  button { margin-top: 18px; width: 100%; padding: 12px; border: 0; border-radius: 8px;
           background: #4a9eff; color: #fff; font-size: 15px; font-weight: 600;
           cursor: pointer; }
  button:hover { background: #3c8ee5; }
  button.secondary { background: #34495e; }
  button.secondary:hover { background: #3d566e; }
  .tabs { display: flex; gap: 8px; margin-bottom: 8px; }
  .tabs button { margin: 0; font-size: 13px; padding: 8px; }
  .tabs button.active { background: #4a9eff; }
  .tabs button:not(.active) { background: #34495e; }
  .err { color: #ff6b6b; font-size: 13px; margin-top: 12px; min-height: 18px; }
  .hint { font-size: 12px; opacity: .55; margin-top: 6px; }
  .row { display: none; }
  .row.active { display: block; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="card">
  <h1>🎮 Игровой портал</h1>

  <div class="tabs">
    <button id="tab-create" class="active" type="button">Создать</button>
    <button id="tab-join" type="button">Войти</button>
  </div>

  <label>Ваш ник</label>
  <input id="name" maxlength="16" placeholder="Например, Артём">

  <!-- CREATE -->
  <div id="pane-create" class="row active">
    <label>Игра</label>
    <select id="game_type">
      <option value="hl">HearthLite (карточная, 2-3)</option>
      <option value="bs">Морской бой (2-3)</option>
      <option value="dk">Дурак (2-3)</option>
    </select>
    <label id="mode-label" class="hidden">Число игроков</label>
    <select id="mode" class="hidden">
      <option value="2" selected>2</option>
      <option value="3">3</option>
    </select>
    <button id="btn-create">Создать игру</button>
    <div class="hint">Получите код и передайте друзьям.</div>
  </div>

  <!-- JOIN -->
  <div id="pane-join" class="row">
    <label>Код игры</label>
    <input id="code" maxlength="8" placeholder="HL-A3B4" style="text-transform: uppercase;">
    <button id="btn-join" class="secondary">Войти в игру</button>
    <div class="hint">Формат: HL-XXXX / BS-XXXX / DK-XXXX.</div>
  </div>

  <div id="err" class="err"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const errBox = $('err');
let tab = 'create';

function setTab(t) {
  tab = t;
  $('tab-create').classList.toggle('active', t === 'create');
  $('tab-join').classList.toggle('active', t === 'join');
  $('pane-create').classList.toggle('active', t === 'create');
  $('pane-join').classList.toggle('active', t === 'join');
  errBox.textContent = '';
}

$('tab-create').onclick = () => setTab('create');
$('tab-join').onclick = () => setTab('join');

$('game_type').onchange = () => {
  const dk = $('game_type').value === 'dk';
  $('mode-label').classList.toggle('hidden', !dk);
  $('mode').classList.toggle('hidden', !dk);
};

async function post(url, body) {
  errBox.textContent = '';
  const r = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  const data = await r.json().catch(() => ({}));
  if (!data.ok) { errBox.textContent = data.error || 'Ошибка'; return null; }
  return data;
}

$('btn-create').onclick = async () => {
  const name = $('name').value.trim();
  if (!name) { errBox.textContent = 'Введите ник'; return; }
  const data = await post('/api/create', {
    game_type: $('game_type').value,
    name,
    mode: parseInt($('mode').value, 10)
  });
  if (data) location.href = data.redirect;
};

$('btn-join').onclick = async () => {
  const name = $('name').value.trim();
  const code = $('code').value.trim().toUpperCase();
  if (!name) { errBox.textContent = 'Введите ник'; return; }
  if (!code) { errBox.textContent = 'Введите код'; return; }
  const data = await post('/api/join', {code, name});
  if (data) location.href = data.redirect;
};

// Разрешаем Enter
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (tab === 'create') $('btn-create').click();
  else $('btn-join').click();
});

// Если уже в игре — сразу в неё
fetch('/api/whoami').then(r => r.json()).then(d => {
  if (d && d.game_type) location.href = '/play';
});
</script>
</body>
</html>
