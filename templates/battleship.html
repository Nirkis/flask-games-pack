<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Морской бой: Четыре флота</title>
<style>
  :root {
    --bg: #050b14;
    --panel: rgba(13, 27, 44, 0.72);
    --border: rgba(100, 165, 220, 0.16);
    --border-2: rgba(100, 180, 255, 0.4);
    --text: #dbe9f7;
    --text-dim: #7f9cbb;
    --text-mute: #516b85;
    --accent: #22d3ee;
    --primary: #3b82f6;
    --danger: #ef4444;
    --gold: #fbbf24;
    --cell: 30px;
    --p0: #3b82f6;
    --p1: #ec4899;
    --p2: #a855f7;
    --p3: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    background:
      radial-gradient(1200px 700px at 8% -10%, rgba(34, 211, 238, 0.07), transparent 60%),
      radial-gradient(1000px 600px at 100% 5%, rgba(59, 130, 246, 0.09), transparent 60%),
      radial-gradient(900px 500px at 50% 110%, rgba(8, 145, 178, 0.06), transparent 60%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
    line-height: 1.5;
  }
  button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }

  .wrap { max-width: 1320px; margin: 0 auto; padding: 20px 20px 40px; }

  .top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px; flex-wrap: wrap;
    padding: 14px 20px;
    background: linear-gradient(135deg, rgba(34, 211, 238, 0.05), rgba(59, 130, 246, 0.03));
    border: 1px solid var(--border);
    border-radius: 18px;
    margin-bottom: 18px;
    backdrop-filter: blur(14px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand .logo {
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, rgba(34, 211, 238, 0.2), rgba(8, 145, 178, 0.08));
    border: 1px solid rgba(34, 211, 238, 0.4);
    border-radius: 12px;
    font-size: 22px;
    box-shadow: 0 0 24px rgba(34, 211, 238, 0.18);
  }
  .brand h1 { font-size: 16px; font-weight: 700; letter-spacing: 0.4px; color: #eaf4ff; }
  .brand .sub {
    font-size: 11.5px; text-transform: uppercase;
    letter-spacing: 1.8px; color: var(--text-mute); font-weight: 600;
  }

  .stats { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .stat {
    display: flex; flex-direction: column; gap: 2px;
    padding: 6px 12px;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .stat .label {
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 1.4px; color: var(--text-mute); font-weight: 700;
  }
  .stat .value { font-size: 14px; font-weight: 700; color: var(--text); }
  .stat .value.mono {
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    letter-spacing: 2px; color: var(--accent); font-size: 15px;
  }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 16px; border-radius: 10px;
    font-size: 13px; font-weight: 700; letter-spacing: 0.3px;
    border: 1px solid transparent;
    background: linear-gradient(180deg, #2563eb, #1d4ed8);
    border-color: rgba(96, 165, 250, 0.5);
    color: #fff;
    box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.14);
    transition: transform 0.08s, box-shadow 0.12s, filter 0.12s;
  }
  .btn:hover:not(:disabled) { filter: brightness(1.12); }
  .btn:active:not(:disabled) { transform: translateY(1px); box-shadow: 0 0 0 rgba(0,0,0,0.4); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; filter: saturate(0.5); }
  .btn.ghost {
    background: rgba(15, 33, 55, 0.7);
    border-color: var(--border);
    color: #bcd5ee;
  }
  .btn.ghost:hover:not(:disabled) { border-color: var(--border-2); color: #e0eefc; }
  .btn.success {
    background: linear-gradient(180deg, #10b981, #059669);
    border-color: rgba(52, 211, 153, 0.5);
  }
  .btn.gold {
    background: linear-gradient(180deg, #f59e0b, #b45309);
    border-color: rgba(251, 191, 36, 0.5);
    color: #1a0e00;
  }
  .btn.sm { padding: 6px 12px; font-size: 12px; }

  .toast {
    display: none; margin-bottom: 16px; padding: 12px 18px;
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(153, 27, 27, 0.15));
    border: 1px solid rgba(248, 113, 113, 0.4);
    border-left: 4px solid var(--danger);
    border-radius: 12px;
    color: #ffd8d8; font-size: 14px;
    animation: slideIn 0.22s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .layout {
    display: grid;
    grid-template-columns: 1fr 1fr 340px;
    gap: 18px;
  }
  @media (max-width: 1180px) {
    .layout { grid-template-columns: 1fr 1fr; }
    .layout .log-card { grid-column: 1 / -1; }
  }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }

  .card {
    background: linear-gradient(180deg, rgba(17, 33, 54, 0.85), rgba(10, 21, 36, 0.9));
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(10px);
  }
  .card h2 {
    font-size: 11.5px; font-weight: 700;
    letter-spacing: 1.6px; text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .card h2::before {
    content: ''; width: 3px; height: 14px;
    background: linear-gradient(180deg, var(--accent), var(--primary));
    border-radius: 2px;
  }
  .hint { font-size: 12.5px; color: var(--text-dim); margin-top: 12px; line-height: 1.6; }
  .hint b { color: #bcd5ee; }

  .banner {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 22px; border-radius: 14px;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.12), rgba(30, 64, 175, 0.06));
    border: 1px solid rgba(96, 165, 250, 0.25);
    margin-bottom: 14px;
    font-size: 15px;
    font-weight: 500;
  }
  .banner .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #60a5fa;
    box-shadow: 0 0 12px rgba(96, 165, 250, 0.9);
    flex-shrink: 0;
  }
  .banner.mine {
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.18), rgba(5, 150, 105, 0.08));
    border-color: rgba(52, 211, 153, 0.5);
    box-shadow: 0 0 40px rgba(16, 185, 129, 0.15);
  }
  .banner.mine .dot {
    background: #34d399;
    box-shadow: 0 0 14px rgba(52, 211, 153, 1);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }
  .banner.win {
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(180, 83, 9, 0.1));
    border-color: rgba(251, 191, 36, 0.55);
    color: #ffeab5; font-size: 17px;
  }
  .banner.win .dot {
    background: var(--gold); box-shadow: 0 0 16px rgba(251, 191, 36, 1);
  }
  .banner .right {
    margin-left: auto; font-size: 12.5px;
    color: var(--text-dim); font-weight: 500;
  }
  .banner.mine .right { color: #a7f3d0; }

  /* -------- STATS STRIP -------- */
  .stats-strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    margin-bottom: 18px;
  }
  .pcard {
    position: relative;
    padding: 11px 14px 11px 18px;
    background: linear-gradient(180deg, rgba(17, 33, 54, 0.85), rgba(10, 21, 36, 0.9));
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex; flex-direction: column; gap: 4px;
    transition: all 0.18s;
  }
  .pcard::before {
    content: ''; position: absolute;
    left: 0; top: 8px; bottom: 8px; width: 4px;
    background: var(--pc);
    border-radius: 0 4px 4px 0;
    box-shadow: 0 0 12px var(--pc);
  }
  .pcard.turn {
    border-color: var(--pc);
    box-shadow: 0 0 24px color-mix(in srgb, var(--pc) 45%, transparent),
                inset 0 0 24px color-mix(in srgb, var(--pc) 12%, transparent);
    animation: turnPulse 1.6s ease-in-out infinite;
  }
  @keyframes turnPulse {
    0%, 100% { box-shadow: 0 0 20px color-mix(in srgb, var(--pc) 35%, transparent),
                          inset 0 0 20px color-mix(in srgb, var(--pc) 10%, transparent); }
    50% { box-shadow: 0 0 34px color-mix(in srgb, var(--pc) 65%, transparent),
                     inset 0 0 26px color-mix(in srgb, var(--pc) 18%, transparent); }
  }
  .pcard.dead { opacity: 0.5; }
  .pcard.me { background: linear-gradient(180deg, rgba(22, 46, 74, 0.95), rgba(12, 26, 44, 0.95)); }
  .pcard .pname {
    font-size: 13.5px; font-weight: 700; color: #e6f0fb;
    display: flex; align-items: center; gap: 8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pcard .pname .tag {
    font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
    padding: 2px 7px; border-radius: 5px;
    background: var(--pc); color: #041018;
  }
  .pcard .pname .deadmark { color: #f87171; font-size: 12px; }
  .pcard .prow {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; color: var(--text-dim);
    gap: 10px;
  }
  .pcard .prow .num {
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-weight: 700; color: #e6f0fb; font-size: 13px;
  }
  .pcard .prow .num.low { color: #fca5a5; }
  .pcard .prow .num.mid { color: #fcd34d; }
  .pcard .prow .num.full { color: #6ee7b7; }
  .pcard .ships {
    display: flex; gap: 3px; margin-top: 2px;
  }
  .pcard .ships i {
    display: block; height: 5px; flex: 1;
    background: color-mix(in srgb, var(--pc) 65%, transparent);
    border-radius: 2px;
    box-shadow: 0 0 4px color-mix(in srgb, var(--pc) 50%, transparent);
  }
  .pcard .ships i.off {
    background: rgba(80, 100, 125, 0.3);
    box-shadow: none;
  }
  .pcard .turn-badge {
    position: absolute; top: 8px; right: 10px;
    font-size: 9.5px; letter-spacing: 1px; font-weight: 800;
    padding: 2px 7px; border-radius: 5px;
    background: var(--pc); color: #041018;
    text-transform: uppercase;
    box-shadow: 0 0 12px var(--pc);
  }

  /* -------- BOARDS -------- */
  table.board {
    border-collapse: separate; border-spacing: 2px;
    user-select: none; margin: 0 auto;
  }
  table.board th {
    font-size: 10.5px; color: var(--text-mute);
    font-weight: 700; width: var(--cell); height: var(--cell);
    text-align: center; letter-spacing: 0.5px;
  }
  table.board td.cell {
    width: var(--cell); height: var(--cell);
    background: linear-gradient(180deg, #122943 0%, #0c1e33 100%);
    border-radius: 5px;
    padding: 0; position: relative;
    transition: background 0.14s, box-shadow 0.14s, transform 0.08s;
    box-shadow: inset 0 0 0 1px rgba(80, 140, 200, 0.08);
  }
  table.board td.cell.ship {
    background: linear-gradient(180deg, #7c93b0 0%, #4a6480 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18),
                inset 0 -1px 0 rgba(0, 0, 0, 0.25);
  }
  table.board td.cell.hit {
    background: radial-gradient(circle at 50% 50%, #fb7185 0%, #b91c1c 80%);
    box-shadow: inset 0 0 10px rgba(255, 200, 200, 0.5),
                0 0 10px var(--sc, #ef4444);
    outline: 2px solid var(--sc, #ef4444);
    outline-offset: -2px;
  }
  table.board td.cell.hit::after {
    content: '✕'; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 900; font-size: 14px;
    text-shadow: 0 0 4px rgba(0, 0, 0, 0.7);
  }
  table.board td.cell.sunk {
    background: linear-gradient(180deg, #5c1010 0%, #2b0505 100%);
    box-shadow: inset 0 0 0 2px var(--sc, #f87171),
                inset 0 0 12px color-mix(in srgb, var(--sc, #f87171) 50%, transparent);
    outline: 2px solid var(--sc, #f87171);
    outline-offset: -2px;
  }
  table.board td.cell.sunk::after {
    content: '☠'; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fecaca; font-size: 13px;
  }
  table.board td.cell.miss {
    background: linear-gradient(180deg, #0a1a2b 0%, #061220 100%);
  }
  table.board td.cell.miss::after {
    content: ''; position: absolute;
    top: 50%; left: 50%;
    width: 7px; height: 7px;
    margin: -3.5px 0 0 -3.5px;
    background: var(--sc, #3b5a7a); border-radius: 50%;
    box-shadow: 0 0 6px var(--sc, #3b5a7a),
                inset 0 0 3px rgba(0, 0, 0, 0.4);
  }
  table.board.enemy.active td.cell:hover:not(.hit):not(.miss):not(.sunk) {
    background: linear-gradient(180deg, #1e4b73 0%, #173a5a 100%);
    box-shadow: inset 0 0 0 1px rgba(34, 211, 238, 0.6),
                0 0 10px rgba(34, 211, 238, 0.3);
    transform: scale(1.04);
  }
  table.board.enemy.active { cursor: crosshair; }
  table.board td.cell.preview-ok {
    background: linear-gradient(180deg, #34d399 0%, #059669 100%) !important;
    box-shadow: 0 0 10px rgba(52, 211, 153, 0.6) !important;
  }
  table.board td.cell.preview-bad {
    background: linear-gradient(180deg, #f87171 0%, #b91c1c 100%) !important;
    box-shadow: 0 0 10px rgba(248, 113, 113, 0.55) !important;
  }

  .dock { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .dock-ship {
    padding: 9px 10px;
    background: linear-gradient(180deg, rgba(31, 111, 235, 0.14), rgba(20, 70, 150, 0.08));
    border: 1.5px solid rgba(100, 165, 220, 0.28);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.14s;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: #cfe1f3;
    user-select: none;
  }
  .dock-ship:hover {
    background: linear-gradient(180deg, rgba(31, 111, 235, 0.3), rgba(20, 70, 150, 0.18));
    border-color: rgba(96, 165, 250, 0.6);
    transform: translateY(-1px);
  }
  .dock-ship.selected {
    background: linear-gradient(180deg, rgba(251, 191, 36, 0.25), rgba(180, 83, 9, 0.1));
    border-color: rgba(251, 191, 36, 0.8);
    box-shadow: 0 0 20px rgba(251, 191, 36, 0.35);
    color: #ffe7a8;
  }
  .dock-ship.placed {
    opacity: 0.4;
    background: rgba(16, 185, 129, 0.1);
    border-color: rgba(52, 211, 153, 0.35);
  }
  .dock-ship.placed:hover {
    opacity: 0.85;
    background: rgba(239, 68, 68, 0.15);
    border-color: rgba(248, 113, 113, 0.6);
  }
  .dock-ship .blocks { display: flex; gap: 2px; }
  .dock-ship .blocks span {
    width: 11px; height: 11px;
    background: linear-gradient(180deg, #7c93b0, #4a6480);
    border-radius: 2px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
  }
  .dock-ship.selected .blocks span {
    background: linear-gradient(180deg, #fcd34d, #d97706);
  }
  .dock-ship .sz { margin-left: auto; color: var(--text-mute); font-weight: 700; font-size: 11px; }

  ul.players { list-style: none; margin: 0 0 12px; }
  ul.players li {
    padding: 9px 12px; font-size: 13.5px;
    background: rgba(20, 40, 65, 0.55);
    border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 6px;
    display: flex; align-items: center; gap: 10px;
    color: #c9d9e9;
  }
  ul.players li::before {
    content: ''; width: 8px; height: 8px; border-radius: 50%;
    background: #4b86c4; flex-shrink: 0;
    box-shadow: 0 0 8px rgba(75, 134, 196, 0.6);
  }
  ul.players li.ready::before { background: #34d399; box-shadow: 0 0 10px rgba(52, 211, 153, 0.9); }
  ul.players li.dead { opacity: 0.5; text-decoration: line-through; }
  ul.players li.dead::before { background: #7f1d1d; box-shadow: none; }
  ul.players li.me { background: rgba(34, 211, 238, 0.08); border-color: rgba(34, 211, 238, 0.35); }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tab {
    padding: 7px 14px; font-size: 12.5px;
    background: rgba(20, 40, 65, 0.7);
    border: 1px solid var(--border);
    border-radius: 9px; color: #bcd5ee;
    transition: all 0.14s; font-weight: 600;
    font-family: inherit;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .tab .cdot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--tc);
    box-shadow: 0 0 6px var(--tc);
  }
  .tab:hover:not(.sel) { border-color: var(--border-2); color: #e6f0fb; }
  .tab.sel {
    background: linear-gradient(180deg, color-mix(in srgb, var(--tc) 30%, #1e293b),
                                       color-mix(in srgb, var(--tc) 15%, #0f172a));
    border-color: var(--tc);
    color: #fff;
    box-shadow: 0 4px 14px color-mix(in srgb, var(--tc) 40%, transparent);
  }
  .tab.dead { opacity: 0.5; }

  .log {
    max-height: 460px; overflow-y: auto;
    font-size: 12.5px; line-height: 1.55;
    padding-right: 6px;
    scrollbar-width: thin;
    scrollbar-color: rgba(96, 165, 250, 0.3) transparent;
  }
  .log::-webkit-scrollbar { width: 6px; }
  .log::-webkit-scrollbar-thumb {
    background: rgba(96, 165, 250, 0.3); border-radius: 3px;
  }
  .log div {
    padding: 7px 10px; margin-bottom: 4px;
    border-radius: 8px;
    background: rgba(20, 40, 65, 0.5);
    border-left: 3px solid rgba(100, 165, 220, 0.4);
    color: #c9d9e9;
  }
  .log div:first-child {
    background: rgba(34, 211, 238, 0.1);
    border-left-color: var(--accent);
    box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.2);
  }
  .log div.log-miss { border-left-color: #64748b; color: #b8c5d3; }
  .log div.log-hit { border-left-color: #f97316; color: #ffd9b3; }
  .log div.log-danger {
    border-left-color: #ef4444; color: #ffd4d4;
    background: rgba(127, 29, 29, 0.22);
  }
  .log div.log-win {
    border-left-color: var(--gold); color: #ffe7a8;
    background: rgba(120, 80, 0, 0.22);
  }

  .legend {
    display: flex; gap: 14px; flex-wrap: wrap;
    margin-top: 12px; font-size: 11.5px; color: var(--text-dim);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend span::before {
    content: ''; width: 12px; height: 12px; border-radius: 3px;
    background: #122943;
  }
  .legend span.ship::before { background: linear-gradient(180deg, #7c93b0, #4a6480); }
  .legend span.miss::before {
    background: #0a1a2b; box-shadow: inset 0 0 0 1px #3b5a7a, 0 0 6px #3b5a7a;
  }
  .legend span.hit::before {
    background: radial-gradient(circle, #fb7185, #b91c1c);
    box-shadow: 0 0 6px #ef4444;
  }
  .legend span.sunk::before {
    background: linear-gradient(180deg, #5c1010, #2b0505);
    box-shadow: inset 0 0 0 1px #f87171;
  }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .actions .btn { flex: 0 0 auto; }

  .placing-note {
    font-size: 13px; padding: 11px 14px;
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.1), rgba(180, 83, 9, 0.04));
    border: 1px solid rgba(251, 191, 36, 0.28);
    margin-bottom: 14px; color: #fde4b3;
  }
  .placing-note b { color: #ffe7a8; }
  .placing-note.ok {
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.14), rgba(5, 150, 105, 0.05));
    border-color: rgba(52, 211, 153, 0.4);
    color: #a7f3d0;
  }
  .placing-note.ok b { color: #6ee7b7; }

  .ready-badge {
    padding: 4px 10px; border-radius: 8px; font-size: 11px;
    background: rgba(16, 185, 129, 0.18); color: #6ee7b7;
    border: 1px solid rgba(52, 211, 153, 0.45);
    font-weight: 700; letter-spacing: 0.5px;
  }

  .conn-panel { text-align: center; padding: 40px 20px; }
  .conn-panel .spinner {
    width: 42px; height: 42px; margin: 0 auto 16px;
    border: 3px solid rgba(96, 165, 250, 0.15);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">⚓</div>
      <div>
        <h1>Морской бой</h1>
        <div class="sub">Четыре флота</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat">
        <span class="label">Код</span>
        <span class="value mono" id="roomCode">—</span>
      </div>
      <div class="stat">
        <span class="label">Фаза</span>
        <span class="value" id="phaseInfo">—</span>
      </div>
      <button class="btn ghost" id="leaveBtn">Выйти</button>
    </div>
  </header>
  <div id="msg" class="toast"></div>
  <div id="root">
    <div class="card conn-panel">
      <div class="spinner"></div>
      <div class="hint">Подключение к партии…</div>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var FIELD = 10;
  var COLS = 'ABCDEFGHIJ';
  var PLAYER_COLORS = ['#3b82f6', '#ec4899', '#a855f7', '#f59e0b'];
  var STATE = null;
  var selectedEnemy = null;
  var selectedShipIdx = null;
  var placementHoriz = true;
  var lastJson = '';
  var msgTimer = null;

  function colorOf(slot) {
    if (slot === null || slot === undefined) return '#64748b';
    return PLAYER_COLORS[slot % PLAYER_COLORS.length];
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function flash(text) {
    var m = document.getElementById('msg');
    m.textContent = text;
    m.style.display = 'block';
    clearTimeout(msgTimer);
    msgTimer = setTimeout(function () { m.style.display = 'none'; }, 2600);
  }

  function goHome() {
    fetch('/api/leave', { method: 'POST', credentials: 'same-origin' })
      .catch(function () {})
      .then(function () { window.location.href = '/'; });
  }
  document.getElementById('leaveBtn').onclick = goHome;

  function post(action, extra) {
    var body = Object.assign({ action: action }, extra || {});
    return fetch('/ms/api/action', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) {
      if (r.status === 404) { goHome(); return null; }
      return r.json().then(function (j) {
        if (!j.ok) { flash(j.error || 'Ошибка'); return null; }
        STATE = j.state;
        render(true);
        return j.state;
      });
    }).catch(function () { return null; });
  }

  /* ============ LOBBY ============ */
  function renderLobby() {
    var html = '<div class="card" style="max-width:520px;margin:0 auto">';
    html += '<h2>Ожидание игроков</h2>';
    html += '<div class="placing-note">Поделитесь кодом партии: <b>' + esc(STATE.game_id) + '</b></div>';
    html += '<ul class="players">';
    STATE.names.forEach(function (n, i) {
      var occ = STATE.occupied[i];
      var cls = occ ? 'me' : '';
      html += '<li class="' + cls + '">' + (occ ? esc(n) : '<i style="color:#516b85">свободное место</i>') + '</li>';
    });
    html += '</ul>';
    html += '<p class="hint">Игра начнётся, когда все места будут заняты.</p>';
    html += '</div>';
    return html;
  }

  /* ============ PLACING ============ */
  function buildShipMap() {
    var shipMap = {};
    STATE.placement.forEach(function (item) {
      if (item.placed) {
        item.cells.forEach(function (rc) { shipMap[rc[0] + ',' + rc[1]] = item.idx; });
      }
    });
    return shipMap;
  }

  function placedCount() {
    var n = 0;
    STATE.placement.forEach(function (it) { if (it.placed) n++; });
    return n;
  }

  function autoSelectShip() {
    if (selectedShipIdx !== null) {
      var cur = STATE.placement.filter(function (p) { return p.idx === selectedShipIdx; })[0];
      if (cur && !cur.placed) return;
    }
    var unplaced = STATE.placement.filter(function (p) { return !p.placed; });
    if (!unplaced.length) { selectedShipIdx = null; return; }
    unplaced.sort(function (a, b) { return b.size - a.size; });
    selectedShipIdx = unplaced[0].idx;
  }

  function renderPlacementBoard() {
    var shipMap = buildShipMap();
    var html = '<table class="board" id="placementBoard"><tr><th></th>';
    for (var c = 0; c < FIELD; c++) html += '<th>' + COLS[c] + '</th>';
    html += '</tr>';
    for (var r = 0; r < FIELD; r++) {
      html += '<tr><th>' + (r + 1) + '</th>';
      for (var cc = 0; cc < FIELD; cc++) {
        var k = r + ',' + cc;
        var cls = 'cell';
        if (shipMap[k] !== undefined) cls += ' ship';
        html += '<td class="' + cls + '" data-r="' + r + '" data-c="' + cc + '"></td>';
      }
      html += '</tr>';
    }
    html += '</table>';
    return html;
  }

  function renderDock() {
    var html = '<div class="dock">';
    STATE.placement.forEach(function (item) {
      var cls = 'dock-ship';
      if (item.placed) cls += ' placed';
      if (selectedShipIdx === item.idx) cls += ' selected';
      html += '<div class="' + cls + '" data-idx="' + item.idx + '">';
      html += '<div class="blocks">';
      for (var i = 0; i < item.size; i++) html += '<span></span>';
      html += '</div>';
      html += '<span class="sz">×' + item.size + '</span>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function renderPlacing() {
    autoSelectShip();
    var placed = placedCount();
    var total = STATE.placement.length;
    var allPlaced = placed === total;

    var html = '<div class="layout" style="grid-template-columns: 1fr 380px">';

    html += '<div class="card"><h2>Ваше поле</h2>';
    var noteCls = STATE.my_ready ? ' placing-note ok' : (allPlaced ? ' placing-note ok' : ' placing-note');
    html += '<div class="' + noteCls.trim() + '">';
    if (STATE.my_ready) {
      html += 'Вы <b>готовы</b>. Ожидание остальных игроков…';
    } else if (allPlaced) {
      html += 'Все корабли расставлены. Нажмите <b>«Готов»</b>.';
    } else {
      html += 'Выберите корабль в доке, поставьте его на поле. ' +
              '<b>ПКМ</b> — повернуть. Клик по кораблю — снять.';
    }
    html += '</div>';
    html += renderPlacementBoard();
    html += '<div class="legend"><span class="ship">ваш корабль</span></div>';
    html += '</div>';

    html += '<div class="card"><h2>Флот · ' + placed + ' / ' + total + '</h2>';
    html += renderDock();
    if (!STATE.my_ready) {
      html += '<div class="actions">';
      html += '<button id="rotateBtn" class="btn ghost sm">⟳ Повернуть</button>';
      html += '<button id="clearBtn" class="btn ghost sm">Очистить</button>';
      html += '<button id="randBtn" class="btn ghost sm">Случайно</button>';
      html += '</div>';
      html += '<div class="actions">';
      html += '<button id="readyBtn" class="btn success" style="flex:1 1 100%"' +
              (allPlaced ? '' : ' disabled') + '>Готов к бою</button>';
      html += '</div>';
      if (!allPlaced) {
        html += '<p class="hint">Кнопка «Готов» станет доступной, когда все <b>' +
                total + '</b> кораблей будут на поле.</p>';
      }
    } else {
      html += '<div style="margin-top:8px"><span class="ready-badge">✓ Вы готовы</span></div>';
    }
    html += '<h2 style="margin-top:22px">Игроки</h2>';
    html += '<ul class="players">';
    STATE.names.forEach(function (n, i) {
      if (!STATE.occupied[i]) return;
      var cls = '';
      if (STATE.eliminated && STATE.eliminated[i]) cls += ' dead';
      else if (STATE.ready[i]) cls += ' ready';
      if (i === STATE.slot) cls += ' me';
      var status = STATE.eliminated[i] ? ' — выбыл' : (STATE.ready[i] ? ' — готов' : ' — расставляет');
      html += '<li class="' + cls.trim() + '">' + esc(n) + status + '</li>';
    });
    html += '</ul>';
    html += '</div></div>';
    return html;
  }

  /* ============ BATTLE ============ */
  function ownBoardHtml(b) {
    var shipCells = {}, hitCells = {}, missCells = {}, sunkCells = {};
    (b && b.ships ? b.ships : []).forEach(function (s) {
      s.cells.forEach(function (rc) { shipCells[rc[0] + ',' + rc[1]] = true; });
      (s.hit_cells || []).forEach(function (rc) {
        hitCells[rc[0] + ',' + rc[1]] = { by: rc[2] };
      });
      if (s.sunk) s.cells.forEach(function (rc) { sunkCells[rc[0] + ',' + rc[1]] = true; });
    });
    (b && b.misses ? b.misses : []).forEach(function (rc) {
      missCells[rc[0] + ',' + rc[1]] = { by: rc[2] };
    });

    var html = '<table class="board"><tr><th></th>';
    for (var c = 0; c < FIELD; c++) html += '<th>' + COLS[c] + '</th>';
    html += '</tr>';
    for (var r = 0; r < FIELD; r++) {
      html += '<tr><th>' + (r + 1) + '</th>';
      for (var cc = 0; cc < FIELD; cc++) {
        var k = r + ',' + cc;
        var cls = 'cell';
        var style = '';
        if (shipCells[k]) cls += ' ship';
        if (hitCells[k]) {
          cls += ' hit';
          style = ' style="--sc:' + colorOf(hitCells[k].by) + '"';
        }
        if (sunkCells[k]) cls += ' sunk';
        if (missCells[k]) {
          cls += ' miss';
          if (!hitCells[k]) style = ' style="--sc:' + colorOf(missCells[k].by) + '"';
        }
        html += '<td class="' + cls + '"' + style + '></td>';
      }
      html += '</tr>';
    }
    html += '</table>';
    return html;
  }

  function enemyBoardHtml(e) {
    var shotMap = {}, sunkMap = {};
    (e.cells || []).forEach(function (t) {
      shotMap[t[0] + ',' + t[1]] = { res: t[2], by: t[3] };
    });
    (e.sunk || []).forEach(function (rc) { sunkMap[rc[0] + ',' + rc[1]] = true; });
    var active = STATE.can_act && !e.eliminated;

    var html = '<table class="board enemy' + (active ? ' active' : '') + '"><tr><th></th>';
    for (var c = 0; c < FIELD; c++) html += '<th>' + COLS[c] + '</th>';
    html += '</tr>';
    for (var r = 0; r < FIELD; r++) {
      html += '<tr><th>' + (r + 1) + '</th>';
      for (var cc = 0; cc < FIELD; cc++) {
        var k = r + ',' + cc;
        var s = shotMap[k];
        var cls = 'cell';
        var style = '';
        if (s && s.res === 'miss') {
          cls += ' miss';
          style = ' style="--sc:' + colorOf(s.by) + '"';
        } else if (s && s.res === 'hit') {
          cls += ' hit';
          style = ' style="--sc:' + colorOf(s.by) + '"';
        }
        if (sunkMap[k]) cls += ' sunk';
        html += '<td class="' + cls + '"' + style + '" data-target="' + e.slot +
                '" data-r="' + r + '" data-c="' + cc + '"></td>';
      }
      html += '</tr>';
    }
    html += '</table>';
    return html;
  }

  function renderStatsStrip() {
    var html = '<div class="stats-strip">';
    var n = STATE.num_players;
    for (var i = 0; i < n; i++) {
      if (!STATE.occupied[i]) continue;
      var isSelf = i === STATE.slot;
      var isDead = STATE.eliminated[i];
      var isTurn = STATE.turn === i && !isDead;
      var alive = 0, total = 10;
      if (isSelf) {
        alive = STATE.my_board ? STATE.my_board.alive_ships : 0;
        total = STATE.my_board ? STATE.my_board.total_ships : 10;
      } else {
        var e = (STATE.enemies || []).filter(function (x) { return x.slot === i; })[0];
        if (e) { alive = e.alive_ships; total = e.total_ships; }
      }
      var lvl = 'full';
      if (alive === 0) lvl = 'low';
      else if (alive <= 3) lvl = 'low';
      else if (alive <= 6) lvl = 'mid';

      var cls = 'pcard';
      if (isTurn) cls += ' turn';
      if (isDead) cls += ' dead';
      if (isSelf) cls += ' me';

      html += '<div class="' + cls + '" style="--pc:' + colorOf(i) + '">';
      if (isTurn) html += '<div class="turn-badge">Ход</div>';
      html += '<div class="pname">';
      html += '<span class="tag" style="background:' + colorOf(i) + '">' +
              String.fromCharCode(65 + i) + '</span>';
      html += esc(STATE.names[i] || ('Игрок ' + (i + 1)));
      if (isSelf) html += ' <span style="color:#7f9cbb;font-size:11px;font-weight:500">(вы)</span>';
      if (isDead) html += ' <span class="deadmark">✝</span>';
      html += '</div>';
      html += '<div class="prow"><span>Корабли</span>' +
              '<span class="num ' + lvl + '">' + alive + ' / ' + total + '</span></div>';
      html += '<div class="ships">';
      for (var k = 0; k < total; k++) {
        html += '<i class="' + (k < alive ? '' : 'off') + '"></i>';
      }
      html += '</div>';
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function renderBattle() {
    var html = '';

    if (STATE.phase === 'finished') {
      html += '<div class="banner win"><span class="dot"></span>';
      if (STATE.winner !== null && STATE.winner !== undefined) {
        html += '🏆 Победитель: <b>&nbsp;' + esc(STATE.names[STATE.winner]) + '</b>';
      } else {
        html += 'Бой завершён';
      }
      html += '</div>';
    } else {
      var t = STATE.turn;
      var mine = STATE.is_my_turn && !STATE.eliminated[STATE.slot];
      html += '<div class="banner' + (mine ? ' mine' : '') + '">';
      html += '<span class="dot" style="background:' + colorOf(t) +
              ';box-shadow:0 0 14px ' + colorOf(t) + '"></span>';
      if (mine) {
        html += '<b>Ваш ход</b> — выберите цель и клетку';
        html += '<span class="right">При попадании стреляете ещё раз</span>';
      } else {
        html += 'Ход: <b>&nbsp;' + esc(STATE.names[t] || '—') + '</b>';
      }
      html += '</div>';
    }

    html += renderStatsStrip();

    html += '<div class="layout">';

    html += '<div class="card"><h2>Ваш флот</h2>' + ownBoardHtml(STATE.my_board);
    html += '<div class="legend">';
    html += '<span class="ship">корабль</span>';
    html += '<span class="hit">попадание</span>';
    html += '<span class="sunk">уничтожен</span>';
    html += '</div></div>';

    html += '<div class="card"><h2>Поле противника</h2>';
    var enemies = STATE.enemies || [];
    if (enemies.length) {
      if (selectedEnemy === null || !enemies.some(function (e) { return e.slot === selectedEnemy; })) {
        var alive = enemies.filter(function (e) { return !e.eliminated; })[0];
        selectedEnemy = alive ? alive.slot : enemies[0].slot;
      }
      html += '<div class="tabs">';
      enemies.forEach(function (e) {
        var cls = 'tab';
        if (e.slot === selectedEnemy) cls += ' sel';
        if (e.eliminated) cls += ' dead';
        html += '<button class="' + cls + '" data-tab="' + e.slot +
                '" style="--tc:' + colorOf(e.slot) + '">';
        html += '<span class="cdot"></span>';
        html += esc(e.name) + (e.eliminated ? ' ✝' : '');
        html += '</button>';
      });
      html += '</div>';
      var cur = enemies.filter(function (e) { return e.slot === selectedEnemy; })[0];
      if (cur) {
        html += enemyBoardHtml(cur);
        html += '<div class="legend">';
        html += '<span class="miss">мимо</span>';
        html += '<span class="hit">попал</span>';
        html += '<span class="sunk">убит</span>';
        html += '</div>';
        if (cur.eliminated) {
          html += '<p class="hint">Этот игрок выбыл.</p>';
        } else if (STATE.can_act) {
          html += '<p class="hint">Кликните по клетке, чтобы выстрелить.</p>';
        }
      }
    }
    html += '</div>';

    html += '<div class="card log-card"><h2>Журнал боя</h2><div class="log">';
    var log = STATE.log || [];
    for (var i = log.length - 1; i >= 0; i--) {
      html += '<div class="' + logClass(log[i]) + '">' + esc(log[i]) + '</div>';
    }
    html += '</div>';
    if (STATE.phase === 'finished') {
      html += '<div class="actions" style="margin-top:14px">';
      html += '<button id="resetBtn" class="btn gold" style="flex:1 1 100%">Новая партия</button>';
      html += '</div>';
    }
    html += '</div>';

    html += '</div>';
    return html;
  }

  function logClass(text) {
    if (/Победа|выбывает|уничтожен|убит/i.test(text)) return 'log-danger';
    if (/попал/i.test(text)) return 'log-hit';
    if (/мимо/i.test(text)) return 'log-miss';
    if (/Бой начался|Новая партия|Все на месте/i.test(text)) return 'log-win';
    return '';
  }

  /* ============ RENDER ============ */
  function render(force) {
    var root = document.getElementById('root');
    var info = document.getElementById('phaseInfo');

    if (!STATE || !STATE.joined) {
      if (force || lastJson !== 'nope') {
        root.innerHTML = '<div class="card conn-panel"><div class="spinner"></div>' +
                         '<div class="hint">Подключение к партии…</div></div>';
        lastJson = 'nope';
      }
      info.textContent = '';
      return;
    }

    var json = JSON.stringify(STATE);
    if (!force && json === lastJson) return;
    lastJson = json;

    if (STATE.phase === 'lobby') {
      info.textContent = 'Лобби';
      root.innerHTML = renderLobby();
    } else if (STATE.phase === 'placing') {
      info.textContent = 'Расстановка';
      root.innerHTML = renderPlacing();
    } else {
      info.textContent = STATE.phase === 'finished' ? 'Завершено' : 'Бой';
      root.innerHTML = renderBattle();
    }
    bind();
  }

  /* ============ PREVIEW ============ */
  function clearPreview() {
    Array.prototype.forEach.call(
      document.querySelectorAll('#placementBoard td.preview-ok, #placementBoard td.preview-bad'),
      function (el) { el.classList.remove('preview-ok', 'preview-bad'); }
    );
  }

  function previewCells(r, c) {
    var item = STATE.placement.filter(function (p) { return p.idx === selectedShipIdx; })[0];
    if (!item || item.placed) return null;
    var size = item.size;
    var cells = [];
    for (var i = 0; i < size; i++) {
      var rr = placementHoriz ? r : r + i;
      var cc = placementHoriz ? c + i : c;
      if (rr < 0 || rr >= FIELD || cc < 0 || cc >= FIELD) return null;
      cells.push([rr, cc]);
    }
    return cells;
  }

  function canPlaceAt(cells) {
    if (!cells) return false;
    var occupied = {};
    STATE.placement.forEach(function (item) {
      if (item.placed && item.idx !== selectedShipIdx) {
        item.cells.forEach(function (rc) { occupied[rc[0] + ',' + rc[1]] = true; });
      }
    });
    for (var i = 0; i < cells.length; i++) {
      var rr = cells[i][0], cc = cells[i][1];
      for (var dr = -1; dr <= 1; dr++) {
        for (var dc = -1; dc <= 1; dc++) {
          if (occupied[(rr + dr) + ',' + (cc + dc)]) return false;
        }
      }
    }
    return true;
  }

  /* ============ BIND ============ */
  function bind() {
    var rand = document.getElementById('randBtn');
    if (rand) rand.onclick = function () { post('randomize'); };

    var clear = document.getElementById('clearBtn');
    if (clear) clear.onclick = function () {
      selectedShipIdx = null;
      post('clear');
    };

    var rot = document.getElementById('rotateBtn');
    if (rot) rot.onclick = function () {
      placementHoriz = !placementHoriz;
      render(true);
    };

    var rdy = document.getElementById('readyBtn');
    if (rdy) rdy.onclick = function () {
      if (placedCount() !== STATE.placement.length) {
        flash('Сначала расставьте все корабли');
        return;
      }
      post('ready');
    };

    var rst = document.getElementById('resetBtn');
    if (rst) rst.onclick = function () {
      fetch('/ms/api/reset', { method: 'POST', credentials: 'same-origin' })
        .then(function (r) { if (r.status === 404) { goHome(); return null; } return r.json(); })
        .then(function (j) {
          if (j && j.ok) { STATE = j.state; lastJson = ''; render(true); }
        })
        .catch(function () {});
    };

    Array.prototype.forEach.call(document.querySelectorAll('.dock-ship'), function (el) {
      el.onclick = function () {
        var idx = parseInt(el.getAttribute('data-idx'), 10);
        var item = STATE.placement.filter(function (p) { return p.idx === idx; })[0];
        if (!item) return;
        if (item.placed) {
          selectedShipIdx = null;
          post('remove_ship', { idx: idx });
        } else {
          selectedShipIdx = (selectedShipIdx === idx) ? null : idx;
          render(true);
        }
      };
    });

    var pBoard = document.getElementById('placementBoard');
    if (pBoard) {
      pBoard.addEventListener('mouseleave', clearPreview);

      pBoard.addEventListener('contextmenu', function (e) {
        if (!STATE || STATE.phase !== 'placing' || STATE.my_ready) return;
        e.preventDefault();
        placementHoriz = !placementHoriz;
        clearPreview();
        render(true);
      });

      Array.prototype.forEach.call(pBoard.querySelectorAll('td.cell'), function (td) {
        td.addEventListener('mouseenter', function () {
          clearPreview();
          if (selectedShipIdx === null) return;
          var r = parseInt(td.getAttribute('data-r'), 10);
          var c = parseInt(td.getAttribute('data-c'), 10);
          var cells = previewCells(r, c);
          if (!cells) return;
          var ok = canPlaceAt(cells);
          var cls = ok ? 'preview-ok' : 'preview-bad';
          cells.forEach(function (rc) {
            var cell = pBoard.querySelector('td[data-r="' + rc[0] + '"][data-c="' + rc[1] + '"]');
            if (cell) cell.classList.add(cls);
          });
        });

        td.addEventListener('click', function () {
          if (STATE.my_ready) return;
          var r = parseInt(td.getAttribute('data-r'), 10);
          var c = parseInt(td.getAttribute('data-c'), 10);
          var occupying = null;
          STATE.placement.forEach(function (item) {
            if (item.placed && occupying === null) {
              for (var i = 0; i < item.cells.length; i++) {
                if (item.cells[i][0] === r && item.cells[i][1] === c) {
                  occupying = item.idx;
                  return;
                }
              }
            }
          });
          if (occupying !== null) {
            selectedShipIdx = null;
            post('remove_ship', { idx: occupying });
            return;
          }
          if (selectedShipIdx === null) {
            flash('Выберите корабль в доке');
            return;
          }
          post('place_ship', {
            idx: selectedShipIdx, r: r, c: c, horiz: placementHoriz
          });
        });
      });
    }

    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (btn) {
      btn.onclick = function () {
        selectedEnemy = parseInt(btn.getAttribute('data-tab'), 10);
        render(true);
      };
    });

    Array.prototype.forEach.call(document.querySelectorAll('td.cell[data-target]'), function (td) {
      td.onclick = function () {
        if (!STATE || !STATE.can_act) return;
        if (td.classList.contains('miss') || td.classList.contains('hit') || td.classList.contains('sunk')) return;
        post('shoot', {
          target: parseInt(td.getAttribute('data-target'), 10),
          r: parseInt(td.getAttribute('data-r'), 10),
          c: parseInt(td.getAttribute('data-c'), 10)
        });
      };
    });
  }

  document.addEventListener('keydown', function (e) {
    if ((e.key === 'r' || e.key === 'R' || e.key === 'к' || e.key === 'К') &&
        STATE && STATE.phase === 'placing' && !STATE.my_ready) {
      placementHoriz = !placementHoriz;
      clearPreview();
      render(true);
    }
  });

  function tick() {
    fetch('/ms/api/state', { credentials: 'same-origin' })
      .then(function (r) {
        if (r.status === 404) { goHome(); return null; }
        return r.json();
      })
      .then(function (j) {
        if (!j) return;
        if (!j.ok) { goHome(); return; }
        STATE = j.state;
        document.getElementById('roomCode').textContent = STATE.game_id || '—';
        render(false);
      })
      .catch(function () {});
  }

  setInterval(tick, 1000);
  tick();
})();
</script>
</body>
</html>
