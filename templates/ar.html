<!-- templates/ar.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena Royale</title>
<style>
:root {
  --bg: #0b0e16; --panel: #171d2b; --panel-2: #1f2637;
  --border: #29314a; --border-2: #3a4460;
  --text: #e9edf5; --muted: #8b98b4; --muted-2: #5f6c88;
  --gold: #f3b83e; --gold-2: #c98f1c;
  --hp: #e35d5d; --atk: #ff9f43;
  --blue: #5b8def; --green: #4ade80; --red: #ef4444; --purple: #a78bfa;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  background: radial-gradient(1200px 600px at 20% -10%, #1a2338 0%, var(--bg) 55%) fixed, var(--bg);
  color: var(--text); min-height: 100vh; font-size: 14px;
  -webkit-font-smoothing: antialiased;
}
.app { max-width: 1220px; margin: 0 auto; padding: 14px; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.brand .logo { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--gold), var(--gold-2)); color: #1a1408; font-size: 18px; box-shadow: 0 4px 14px rgba(243,184,62,.35); }
.brand .title { font-size: 17px; }
.brand .sub { color: var(--muted); font-weight: 500; font-size: 12px; }
.room { display: flex; align-items: center; gap: 8px; background: #0e1320; border: 1px solid var(--border); padding: 7px 12px; border-radius: 10px; font-size: 13px; }
.room .label { color: var(--muted); }
.room .code { font-family: ui-monospace, monospace; font-weight: 700; color: var(--gold); letter-spacing: 1px; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border-2); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 500; }
.btn-ghost:hover { color: var(--text); border-color: var(--red); background: rgba(239,68,68,.08); }

.lobby { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 28px 20px; text-align: center; }
.lobby h2 { margin: 0 0 6px; font-size: 20px; }
.lobby .sub { color: var(--muted); margin-bottom: 22px; font-size: 13px; }
.slot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; max-width: 720px; margin: 0 auto; }
.slot { padding: 14px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--border); text-align: left; font-size: 14px; }
.slot.filled { border-color: var(--green); background: rgba(74,222,128,.06); }
.slot .slot-i { color: var(--muted-2); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
.slot .slot-name { margin-top: 4px; font-weight: 600; }
.slot.filled .slot-name::before { content: "● "; color: var(--green); }
.slot.empty .slot-name { color: var(--muted-2); font-weight: 400; font-style: italic; }
.lobby .spinner { margin-top: 22px; display: inline-block; width: 18px; height: 18px; border: 2px solid var(--border-2); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.hero-card { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: linear-gradient(135deg, #202a44, #171d2b 70%); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 12px; position: relative; overflow: hidden; }
.hero-card::before { content: ""; position: absolute; inset: 0; background: radial-gradient(400px 120px at 0% 50%, rgba(243,184,62,.15), transparent 70%); pointer-events: none; }
.hero-icon { width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #3a2f5a, #221a3a); border: 1px solid #4a3d76; font-size: 24px; }
.hero-meta { flex: 1; min-width: 0; position: relative; }
.hero-name { font-weight: 700; font-size: 15px; }
.hero-desc { color: var(--muted); font-size: 12px; margin-top: 2px; }
.hero-active { margin-top: 6px; padding: 5px 9px; border-radius: 8px; background: rgba(167,139,250,.12); border: 1px dashed #5d4a9e; color: #c4b2ff; font-size: 11px; display: inline-block; }
.hero-active b { color: #d8ccff; }
.hero-right { text-align: right; position: relative; }
.phase-badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
.phase-recruit { background: rgba(91,141,239,.15); color: #8fb4ff; border: 1px solid #3455a0; }
.phase-combat  { background: rgba(239,68,68,.15);  color: #ff9090; border: 1px solid #a03434; }
.phase-result  { background: rgba(167,139,250,.15); color: #c4b2ff; border: 1px solid #5d4a9e; }
.phase-end     { background: rgba(243,184,62,.15);  color: #ffd479; border: 1px solid #8a6a1c; }
.hero-right .round { color: var(--muted); font-size: 12px; margin-top: 4px; }

.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
.stat-box { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
.stat-box .lbl { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
.stat-box .val { font-size: 20px; font-weight: 700; margin-top: 2px; line-height: 1.1; }
.stat-box.hp .val { color: var(--hp); }
.stat-box.gold .val { color: var(--gold); }
.stat-box.tavern .val { color: var(--blue); }
.stat-box.field .val { color: var(--purple); }

.timer-wrap { position: relative; height: 28px; border-radius: 10px; background: var(--panel); border: 1px solid var(--border); overflow: hidden; margin-bottom: 16px; }
.timer-fill { position: absolute; inset: 0; width: 100%; background: linear-gradient(90deg, #3455a0, #5b8def); transition: width .6s linear; }
.timer-fill.warn { background: linear-gradient(90deg, #a05020, #ef8a44); }
.timer-fill.danger { background: linear-gradient(90deg, #802020, #e35d5d); }
.timer-fill.result { background: linear-gradient(90deg, #4a3a80, #a78bfa); }
.timer-text { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; height: 100%; font-weight: 700; font-size: 13px; letter-spacing: 1px; text-shadow: 0 1px 2px rgba(0,0,0,.5); }

section.block { margin-bottom: 16px; }
section.block > header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; padding: 0 2px; }
section.block h2 { margin: 0; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.4px; color: var(--muted); }
section.block .hint { color: var(--muted-2); font-size: 12px; font-weight: 500; }

.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.unit-card { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--border); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; transition: transform .12s, border-color .12s; }
.unit-card:hover { border-color: var(--border-2); transform: translateY(-2px); }
.unit-card.tier-2 { border-top: 2px solid #5b8def; }
.unit-card.tier-3 { border-top: 2px solid var(--purple); }
.unit-card.empty-pool { opacity: .4; filter: grayscale(.6); }
.unit-card.empty-slot { opacity: .3; align-items: center; justify-content: center; min-height: 130px; color: var(--muted-2); font-size: 12px; font-style: italic; }
.spell-card { background: linear-gradient(180deg, #2c2340, #191428); border-top: 2px solid var(--purple); }
.spell-pill { background: #4a3d76; color: #c4b2ff; }
.spell-desc { font-size: 11px; color: var(--muted); line-height: 1.35; min-height: 32px; }
.btn-buy-spell { background: linear-gradient(180deg, #6a4a9e, #4a3272); border-color: #8a68c8; color: #e2d4ff; }
.btn-buy-spell:hover:not(:disabled) { background: linear-gradient(180deg, #7a58ae, #573a82); }
.unit-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.unit-name { font-weight: 700; font-size: 13px; }
.tier-pill { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: #2a3350; color: #98a6c8; }
.tier-pill.t2 { background: #233a6b; color: #8fb4ff; }
.tier-pill.t3 { background: #362a5c; color: #c4b2ff; }
.ability-tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 6px; background: rgba(167,139,250,.15); color: #c4b2ff; font-size: 10px; font-weight: 700; }
.ability-poison { background: rgba(74,222,128,.15); color: #86efac; }
.ability-shield { background: rgba(91,141,239,.15); color: #8fb4ff; }
.ability-regen  { background: rgba(239,68,68,.15);  color: #ff9090; }
.ability-cleave { background: rgba(243,184,62,.15); color: #ffd479; }
.unit-stats { display: flex; gap: 10px; font-size: 13px; font-weight: 600; }
.unit-stats .atk { color: var(--atk); }
.unit-stats .hp { color: var(--hp); }
.unit-foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: auto; }
.cost { color: var(--gold); font-weight: 700; font-size: 13px; }
.pool-count { font-size: 11px; color: var(--muted-2); }
.pool-count b { color: var(--muted); }
.btn-buy { background: linear-gradient(180deg, #3a7a4a, #276b3a); border: 1px solid #4a9a5e; color: #dcfce7; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; }
.btn-buy:hover:not(:disabled) { background: linear-gradient(180deg, #4a8a5a, #2f7a44); }
.btn-buy:disabled { opacity: .35; cursor: not-allowed; }

.hand-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; padding: 10px; background: linear-gradient(180deg, #14192a, #10141f); border: 1px solid var(--border); border-radius: 12px; }
.hand-slot-empty { aspect-ratio: 3/4; border: 1px dashed var(--border); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--muted-2); font-size: 11px; }
.hand-card { aspect-ratio: 3/4; background: linear-gradient(180deg, #263052, #1a2034); border: 1px solid #3a4a78; border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; position: relative; transition: transform .12s; }
.hand-card:hover { transform: translateY(-2px); }
.hand-card.gold { background: linear-gradient(180deg, #4a3a14, #2a2010); border-color: var(--gold); box-shadow: 0 0 14px rgba(243,184,62,.25); }
.hand-card.gold::after { content: "★"; position: absolute; top: 4px; right: 6px; color: var(--gold); font-size: 12px; }
.hand-card .u-name { font-weight: 700; font-size: 12px; line-height: 1.2; }
.hand-card .u-stats { display: flex; gap: 8px; font-weight: 700; font-size: 13px; }
.hand-card .u-stats .atk { color: var(--atk); }
.hand-card .u-stats .hp { color: var(--hp); }
.hand-card .u-actions { margin-top: auto; display: flex; flex-direction: column; gap: 4px; }
.btn-play { background: linear-gradient(180deg, #3a5a8a, #274a7a); border: 1px solid #4a7aae; color: #d0e2ff; border-radius: 6px; padding: 3px 0; font-size: 11px; font-weight: 600; cursor: pointer; }
.btn-play:hover:not(:disabled) { background: linear-gradient(180deg, #4a6a9a, #2f5a8a); }
.btn-play:disabled { opacity: .35; cursor: not-allowed; }
.btn-sell-h { background: rgba(239,68,68,.12); color: #ffb0b0; border: 1px solid #6a2b2b; border-radius: 6px; padding: 3px 0; font-size: 11px; cursor: pointer; }
.btn-sell-h:hover:not(:disabled) { background: rgba(239,68,68,.22); }
.btn-sell-h:disabled { opacity: .35; cursor: not-allowed; }
.btn-gold { background: rgba(243,184,62,.15); color: #ffd479; border: 1px solid #8a6a1c; border-radius: 6px; padding: 3px 0; font-size: 11px; cursor: pointer; font-weight: 700; }
.btn-gold:hover:not(:disabled) { background: rgba(243,184,62,.28); }
.btn-gold:disabled { opacity: .35; cursor: not-allowed; }
.u-ab { position: absolute; top: 4px; left: 6px; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.35); font-size: 11px; }

.field-slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.field-slot { aspect-ratio: 3 / 4; border-radius: 12px; border: 1px dashed var(--border); background: rgba(255,255,255,.01); display: flex; align-items: center; justify-content: center; color: var(--muted-2); font-size: 12px; }
.unit-on-field { aspect-ratio: 3 / 4; border-radius: 12px; padding: 8px; background: linear-gradient(180deg, #263052, #1a2034); border: 1px solid #3a4a78; display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden; transition: transform .12s; }
.unit-on-field:hover { transform: translateY(-2px); }
.unit-on-field.gold { background: linear-gradient(180deg, #4a3a14, #2a2010); border-color: var(--gold); box-shadow: 0 0 14px rgba(243,184,62,.25), inset 0 0 20px rgba(243,184,62,.08); }
.unit-on-field.gold::after { content: "★"; position: absolute; top: 4px; right: 6px; color: var(--gold); font-size: 12px; }
.unit-on-field .u-name { font-weight: 700; font-size: 12px; line-height: 1.2; }
.unit-on-field .u-stats { display: flex; gap: 8px; font-weight: 700; font-size: 13px; margin-top: auto; }
.unit-on-field .u-stats .atk { color: var(--atk); }
.unit-on-field .u-stats .hp { color: var(--hp); }
.unit-on-field .u-actions { display: flex; flex-direction: column; gap: 3px; }
.btn-sell { background: rgba(239,68,68,.12); color: #ffb0b0; border: 1px solid #6a2b2b; border-radius: 6px; padding: 3px 0; font-size: 11px; cursor: pointer; width: 100%; }
.btn-sell:hover:not(:disabled) { background: rgba(239,68,68,.22); }
.btn-sell:disabled { opacity: .35; cursor: not-allowed; }

.action-bar { display: flex; gap: 10px; flex-wrap: wrap; padding: 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--border); margin-bottom: 16px; }
.btn { padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; border: 1px solid transparent; transition: all .12s; }
.btn-refresh { background: linear-gradient(180deg, #4a5a2a, #354020); border-color: #6a7a3a; color: #e2f0c0; }
.btn-refresh:hover:not(:disabled) { background: linear-gradient(180deg, #5a6a3a, #404a2a); }
.btn-upgrade { background: linear-gradient(180deg, #4a3a86, #352a6b); border-color: #6a54c0; color: #d8ccff; }
.btn-upgrade:hover:not(:disabled) { background: linear-gradient(180deg, #584a9a, #3f3378); }
.btn-active { background: linear-gradient(180deg, #6a4a9e, #4a3272); border-color: #8a68c8; color: #e2d4ff; }
.btn-active:hover:not(:disabled) { background: linear-gradient(180deg, #7a58ae, #573a82); }
.btn-ready { background: linear-gradient(180deg, #3a7a4a, #276b3a); border-color: #4a9a5e; color: #dcfce7; margin-left: auto; }
.btn-ready:hover:not(:disabled) { background: linear-gradient(180deg, #4a8a5a, #2f7a44); }
.btn-ready.done { background: #223045; color: var(--muted); border-color: var(--border-2); }
.btn:disabled { opacity: .4; cursor: not-allowed; }

.combat-card { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
.combat-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.combat-fighters { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.combat-fighters .p1 { color: #8fb4ff; }
.combat-fighters .p2 { color: #ff9090; }
.combat-fighters .vs { color: var(--muted-2); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
.combat-step { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; }
.combat-step b { color: var(--text); }
.arena { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: start; }
.army { display: flex; flex-wrap: wrap; gap: 6px; }
.army.right { justify-content: flex-end; }
.army-divider { width: 1px; background: linear-gradient(180deg, transparent, var(--border), transparent); align-self: stretch; }
.combat-unit { background: #232b40; border: 1px solid #3a4460; border-radius: 8px; padding: 6px 8px; font-size: 12px; font-weight: 600; display: flex; flex-direction: column; gap: 2px; min-width: 72px; position: relative; }
.combat-unit.enemy { background: #2a1f28; border-color: #55334a; }
.combat-unit.gold { border-color: var(--gold); box-shadow: 0 0 8px rgba(243,184,62,.35); }
.combat-unit .un { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .5px; }
.combat-unit .us { display: flex; gap: 6px; }
.combat-unit .us .atk { color: var(--atk); }
.combat-unit .us .hp { color: var(--hp); }
.combat-unit .u-ab { position: absolute; top: -4px; right: -4px; width: 16px; height: 16px; border-radius: 50%; background: #0b0e16; display: flex; align-items: center; justify-content: center; font-size: 10px; border: 1px solid var(--border-2); }
.combat-empty { color: var(--muted-2); font-size: 12px; font-style: italic; }
.combat-winner { margin-top: 10px; padding: 8px 12px; border-radius: 8px; background: rgba(74,222,128,.1); border: 1px solid #2f7a44; color: #b8f0c8; font-size: 13px; font-weight: 600; }
.combat-winner.draw { background: rgba(139,152,180,.08); border-color: var(--border-2); color: var(--muted); }

.result-list { display: flex; flex-direction: column; gap: 8px; }
.result-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--border); font-size: 13px; }
.result-row.win { border-left: 3px solid var(--green); }
.result-row.lose { border-left: 3px solid var(--red); }
.result-row.draw { border-left: 3px solid var(--muted-2); }
.result-people { display: flex; gap: 8px; align-items: center; }
.result-people .r-p1 { font-weight: 600; }
.result-people .r-vs { color: var(--muted-2); font-size: 11px; }
.result-dmg { color: var(--hp); font-weight: 700; }
.result-dmg.zero { color: var(--muted-2); font-weight: 500; }

.victory { text-align: center; padding: 40px 20px; background: linear-gradient(180deg, #2a2414, var(--panel)); border: 1px solid var(--gold-2); border-radius: 16px; box-shadow: 0 0 40px rgba(243,184,62,.15) inset; }
.victory .crown { font-size: 56px; margin-bottom: 8px; }
.victory h2 { margin: 0; font-size: 26px; color: var(--gold); }
.victory .sub { color: var(--muted); margin-top: 6px; }

.players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.player-card { padding: 10px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--border); }
.player-card.me { border-color: var(--blue); box-shadow: 0 0 0 1px rgba(91,141,239,.25); }
.player-card.dead { opacity: .45; }
.player-card .p-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.player-card .p-name { font-weight: 700; font-size: 13px; }
.player-card .p-hpbar { height: 6px; border-radius: 3px; background: #2a1a1a; overflow: hidden; margin-bottom: 6px; }
.player-card .p-hpbar > div { height: 100%; background: linear-gradient(90deg, #b83e3e, #e35d5d); transition: width .3s; }
.player-card .p-foot { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
.badge-me { display: inline-block; padding: 1px 6px; border-radius: 4px; background: rgba(91,141,239,.2); color: #8fb4ff; font-size: 10px; font-weight: 700; margin-left: 6px; }
.badge-dead { display: inline-block; padding: 1px 6px; border-radius: 4px; background: rgba(239,68,68,.15); color: #ff9090; font-size: 10px; font-weight: 700; margin-left: 6px; }

#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: linear-gradient(180deg, #7a2a2a, #5a1f1f); border: 1px solid #a04040; color: #fff; padding: 10px 18px; border-radius: 10px; font-weight: 600; font-size: 13px; opacity: 0; transition: all .25s; pointer-events: none; z-index: 100; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.muted { color: var(--muted); font-size: 12px; }

@media (max-width: 640px) {
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .arena { grid-template-columns: 1fr; }
  .army-divider { height: 1px; width: auto; }
  .brand .sub { display: none; }
  .room .label { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <span class="logo">⚔</span>
      <div>
        <div class="title">Arena Royale</div>
        <div class="sub">карточная королевская битва</div>
      </div>
    </div>
    <div class="room">
      <span class="label">Комната</span>
      <span class="code" id="roomCode">—</span>
    </div>
    <button id="leaveBtn" class="btn-ghost">Выйти</button>
  </div>
  <div id="root"><div class="lobby"><h2>Загрузка…</h2></div></div>
</div>
<div id="toast"></div>
<script>
(function () {
  'use strict';
  let STATE = null;

  function goHome() {
    fetch('/api/leave', { method: 'POST', credentials: 'same-origin' })
      .catch(function () {}).then(function () { window.location.href = '/'; });
  }
  document.getElementById('leaveBtn').onclick = goHome;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  async function act(body) {
    try {
      var r = await fetch('/ar/api/action', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (r.status === 404) { goHome(); return; }
      var j = await r.json();
      if (j.ok && j.state) { STATE = j.state; render(); }
      else if (j.error) { toast(j.error); }
    } catch (e) {}
  }

  window.AR_buy = function (i) { act({ action: 'buy', idx: i }); };
  window.AR_play = function (i) { act({ action: 'play', idx: i }); };
  window.AR_sellField = function (i) { act({ action: 'sell', idx: i }); };
  window.AR_sellHand = function (i) { act({ action: 'sell_hand', idx: i }); };
  window.AR_makeGoldenHand = function (i) { act({ action: 'make_golden', loc: 'hand', idx: i }); };
  window.AR_makeGoldenField = function (i) { act({ action: 'make_golden', loc: 'field', idx: i }); };
  window.AR_refresh = function () { act({ action: 'refresh' }); };
  window.AR_upgrade = function () { act({ action: 'upgrade' }); };
  window.AR_ready = function () { act({ action: 'ready' }); };
  window.AR_active = function () { act({ action: 'use_active' }); };

  function unitName(u) {
    if (STATE && STATE.unit_names && STATE.unit_names[u.uid]) return STATE.unit_names[u.uid];
    return u.uid;
  }
  function heroName(hid) {
    if (STATE && STATE.hero_names && STATE.hero_names[hid]) return STATE.hero_names[hid];
    return hid;
  }
  function abilityInfo(code) {
    if (!STATE || !STATE.ability_info) return null;
    return STATE.ability_info[code] || null;
  }
  function abilityTag(code) {
    var a = abilityInfo(code);
    if (!a || !a.name) return '';
    return '<span class="ability-tag ability-' + code + '" title="' + esc(a.desc) + '">' + a.icon + ' ' + esc(a.name) + '</span>';
  }
  function abilityIcon(code) {
    var a = abilityInfo(code);
    if (!a || !a.icon) return '';
    return '<span class="u-ab" title="' + esc(a.name + ' — ' + a.desc) + '">' + a.icon + '</span>';
  }
  function phaseBadge(p) {
    var map = {
      'recruit': ['Найм', 'phase-recruit'],
      'combat':  ['Бой', 'phase-combat'],
      'result':  ['Итоги', 'phase-result'],
      'end':     ['Финал', 'phase-end']
    };
    var m = map[p] || [p, 'phase-recruit'];
    return '<span class="phase-badge ' + m[1] + '">' + esc(m[0]) + '</span>';
  }

  function renderLobby() {
    var n = STATE.occupied.length;
    var taken = STATE.occupied.filter(Boolean).length;
    var slots = '';
    for (var i = 0; i < n; i++) {
      if (STATE.occupied[i]) {
        slots += '<div class="slot filled"><div class="slot-i">Слот ' + (i + 1) + '</div>' +
          '<div class="slot-name">' + esc(STATE.names[i]) +
          (i === STATE.slot ? ' <span class="badge-me">вы</span>' : '') + '</div></div>';
      } else {
        slots += '<div class="slot empty"><div class="slot-i">Слот ' + (i + 1) + '</div>' +
          '<div class="slot-name">свободно</div></div>';
      }
    }
    return '<div class="lobby"><h2>Ожидание игроков</h2>' +
      '<div class="sub">' + taken + ' / ' + n + ' на месте</div>' +
      '<div class="slot-grid">' + slots + '</div>' +
      '<div class="spinner"></div></div>';
  }

  function renderHeroAndStats() {
    var timerPct = 0, timerClass = '', timerText = '';
    if (STATE.phase === 'recruit') {
      timerPct = Math.max(0, Math.min(100, (STATE.timer / 20) * 100));
      timerClass = STATE.timer <= 5 ? 'danger' : (STATE.timer <= 10 ? 'warn' : '');
      timerText = STATE.timer + ' сек';
    } else if (STATE.phase === 'result') {
      timerPct = Math.max(0, Math.min(100, (STATE.timer / 4) * 100));
      timerClass = 'result';
      timerText = 'Следующий раунд: ' + STATE.timer + 'с';
    }
    var html = '';
    var act = STATE.hero_info.active;
    html += '<div class="hero-card">' +
      '<div class="hero-icon">👑</div>' +
      '<div class="hero-meta">' +
        '<div class="hero-name">' + esc(STATE.hero_info.name) + '</div>' +
        '<div class="hero-desc">' + esc(STATE.hero_info.desc) + '</div>' +
        (act ? '<div class="hero-active">⚡ <b>' + esc(act.name) + '</b> — ' + esc(act.desc) + '</div>' : '') +
      '</div>' +
      '<div class="hero-right">' + phaseBadge(STATE.phase) +
        '<div class="round">Раунд ' + STATE.round + '</div>' +
      '</div></div>';
    html += '<div class="stats-row">' +
      '<div class="stat-box hp"><div class="lbl">Здоровье</div><div class="val">' + STATE.my_hp + '</div></div>' +
      '<div class="stat-box gold"><div class="lbl">Золото</div><div class="val">' + STATE.my_gold + '</div></div>' +
      '<div class="stat-box tavern"><div class="lbl">Таверна</div><div class="val">' + STATE.my_tavern + '</div></div>' +
      '<div class="stat-box field"><div class="lbl">Поле / рука</div><div class="val">' + STATE.my_field.length + '/' + STATE.my_max_field + ' · ' + STATE.my_hand.length + '/' + STATE.hand_max + '</div></div>' +
    '</div>';
    if (timerText) {
      html += '<div class="timer-wrap"><div class="timer-fill ' + timerClass + '" style="width:' + timerPct + '%"></div>' +
        '<div class="timer-text">' + timerText + '</div></div>';
    }
    if (!STATE.my_alive) {
      html += '<div class="combat-winner" style="background:rgba(239,68,68,.1);border-color:#6a2b2b;color:#ffb0b0;margin-bottom:16px;">Вы выбыли из матча. Наблюдаете за другими.</div>';
    }
    return html;
  }

  function renderShop() {
    if (STATE.phase !== 'recruit') return '';
    var html = '<section class="block"><header><h2>Таверна · уровень ' + STATE.my_tavern + '</h2>' +
      '<span class="hint">случайные карты и заклинания, обновление ' + STATE.refresh_cost + ' 💰</span></header><div class="shop-grid">';
    for (var i = 0; i < STATE.my_shop.length; i++) {
      var s = STATE.my_shop[i];
      if (s == null) {
        html += '<div class="unit-card empty-slot">пусто</div>';
        continue;
      }
      if (s.kind === 'spell') {
        var sdis = STATE.can_act ? '' : ' disabled';
        html += '<div class="unit-card spell-card">' +
          '<div class="unit-head">' +
            '<span class="unit-name">' + s.icon + ' ' + esc(s.name) + '</span>' +
            '<span class="tier-pill spell-pill">Spell</span>' +
          '</div>' +
          '<div class="spell-desc">' + esc(s.desc) + '</div>' +
          '<div class="unit-foot">' +
            '<span class="cost">💰 ' + s.cost + '</span>' +
            '<button class="btn-buy btn-buy-spell" onclick="AR_buy(' + s.slot + ')"' + sdis + '>Применить</button>' +
          '</div></div>';
        continue;
      }
      var cls = 'unit-card tier-' + s.tier + (s.count <= 0 ? ' empty-pool' : '');
      var dis = (!STATE.can_act || s.count <= 0) ? ' disabled' : '';
      html += '<div class="' + cls + '">' +
        '<div class="unit-head">' +
          '<span class="unit-name">' + esc(s.name) + '</span>' +
          '<span class="tier-pill t' + s.tier + '">T' + s.tier + '</span>' +
        '</div>' +
        '<div>' + abilityTag(s.ability) + '</div>' +
        '<div class="unit-stats">' +
          '<span class="atk">⚔ ' + s.atk + '</span>' +
          '<span class="hp">♥ ' + s.hp + '</span>' +
        '</div>' +
        '<div class="pool-count">В пуле: <b>' + s.count + '</b></div>' +
        '<div class="unit-foot">' +
          '<span class="cost">💰 ' + s.cost + '</span>' +
          '<button class="btn-buy" onclick="AR_buy(' + s.slot + ')"' + dis + '>Купить</button>' +
        '</div></div>';
    }
    html += '</div></section>';
    return html;
  }

  function renderHand() {
    if (STATE.phase !== 'recruit' && STATE.phase !== 'result') return '';
    var html = '<section class="block"><header><h2>Рука</h2>' +
      '<span class="hint">' + STATE.my_hand.length + ' / ' + STATE.hand_max + ' · золотые дают бонус-карту</span></header><div class="hand-strip">';
    for (var i = 0; i < STATE.my_hand.length; i++) {
      var u = STATE.my_hand[i];
      var cls = 'hand-card' + (u.gold ? ' gold' : '');
      var dis = STATE.can_act ? '' : ' disabled';
      var canGold = STATE.can_act && !u.gold && STATE.my_gold >= STATE.golden_cost;
      html += '<div class="' + cls + '">' +
        abilityIcon(u.ability) +
        '<div class="u-name">' + esc(unitName(u)) + '</div>' +
        '<div class="u-stats"><span class="atk">⚔' + u.atk + '</span><span class="hp">♥' + u.hp + '</span></div>' +
        '<div class="u-actions">' +
          '<button class="btn-play" onclick="AR_play(' + i + ')"' + dis + '>На поле</button>' +
          (u.gold ? '' : '<button class="btn-gold" title="Золотой юнит (двойные статы + бонус-карта) · ' + STATE.golden_cost + ' 💰" onclick="AR_makeGoldenHand(' + i + ')"' + (canGold ? '' : ' disabled') + '>★ За золото</button>') +
          '<button class="btn-sell-h" onclick="AR_sellHand(' + i + ')"' + dis + '>Продать</button>' +
        '</div></div>';
    }
    for (var k = STATE.my_hand.length; k < STATE.hand_max; k++) {
      html += '<div class="hand-slot-empty">пусто</div>';
    }
    html += '</div></section>';
    return html;
  }

  function renderActionBar() {
    if (STATE.phase !== 'recruit') return '';
    var html = '<div class="action-bar">';
    html += '<button class="btn btn-refresh" onclick="AR_refresh()"' + (STATE.can_act ? '' : ' disabled') + '>🔄 Обновить · ' + STATE.refresh_cost + ' 💰</button>';
    var act = STATE.hero_info.active;
    if (act) {
      var used = STATE.my_active_used;
      html += '<button class="btn btn-active" onclick="AR_active()"' +
        ((STATE.can_act && !used) ? '' : ' disabled') +
        ' title="' + esc(act.desc) + '">⚡ ' + esc(act.name) + (used ? ' ✓' : '') + '</button>';
    }
    if (STATE.upgrade_cost != null) {
      html += '<button class="btn btn-upgrade" onclick="AR_upgrade()"' + (STATE.can_act ? '' : ' disabled') + '>⬆ Таверна · ' + STATE.upgrade_cost + ' 💰</button>';
    } else {
      html += '<button class="btn btn-upgrade" disabled>⬆ Таверна максимальна</button>';
    }
    if (STATE.my_ready) {
      html += '<button class="btn btn-ready done" disabled>✓ Готовы</button>';
    } else {
      html += '<button class="btn btn-ready" onclick="AR_ready()"' + (STATE.can_act ? '' : ' disabled') + '>Готов к бою</button>';
    }
    html += '</div>';
    return html;
  }

  function renderField() {
    if (STATE.phase !== 'recruit' && STATE.phase !== 'result') return '';
    var html = '<section class="block"><header><h2>Моё поле</h2>' +
      '<span class="hint">' + STATE.my_field.length + ' / ' + STATE.my_max_field + '</span></header><div class="field-slots">';
    for (var i = 0; i < STATE.my_field.length; i++) {
      var u = STATE.my_field[i];
      var cls = 'unit-on-field' + (u.gold ? ' gold' : '');
      var dis = STATE.can_act ? '' : ' disabled';
      var canGold = STATE.can_act && !u.gold && STATE.my_gold >= STATE.golden_cost;
      html += '<div class="' + cls + '">' +
        abilityIcon(u.ability) +
        '<div class="u-name">' + esc(unitName(u)) + '</div>' +
        '<div class="u-stats"><span class="atk">⚔' + u.atk + '</span><span class="hp">♥' + u.hp + '</span></div>' +
        '<div class="u-actions">' +
          (u.gold ? '' : '<button class="btn-gold" title="Золотой юнит (двойные статы + бонус-карта) · ' + STATE.golden_cost + ' 💰" onclick="AR_makeGoldenField(' + i + ')"' + (canGold ? '' : ' disabled') + '>★</button>') +
          '<button class="btn-sell" onclick="AR_sellField(' + i + ')"' + dis + '>Продать</button>' +
        '</div></div>';
    }
    for (var k = STATE.my_field.length; k < STATE.my_max_field; k++) {
      html += '<div class="field-slot">пусто</div>';
    }
    html += '</div></section>';
    return html;
  }

  function renderCombat() {
    if (STATE.phase !== 'combat') return '';
    var html = '<section class="block"><header><h2>Битва</h2>' +
      '<span class="hint">шаг ' + ((STATE.combats.length && STATE.combats[0].step) || 0) + ' / 30</span></header>';
    if (!STATE.combats.length) {
      html += '<div class="muted">В этом бою вы не участвуете.</div></section>';
      return html;
    }
    for (var ci = 0; ci < STATE.combats.length; ci++) {
      var c = STATE.combats[ci];
      var aName = esc(STATE.names[c.a]);
      var bName = c.b == null ? '—' : esc(STATE.names[c.b]);
      html += '<div class="combat-card"><div class="combat-head">' +
        '<div class="combat-fighters">' +
          '<span class="p1">' + aName + '</span><span class="vs">vs</span><span class="p2">' + bName + '</span>' +
          (c.ghost ? ' <span class="badge-me" style="background:rgba(167,139,250,.2);color:#c4b2ff;">призрак</span>' : '') +
        '</div>' +
        '<div class="combat-step">шаг <b>' + c.step + '</b>/30</div></div>';
      html += '<div class="arena"><div class="army">';
      if (!c.army_a.length) html += '<span class="combat-empty">армия уничтожена</span>';
      for (var ai = 0; ai < c.army_a.length; ai++) {
        var ua = c.army_a[ai];
        html += '<div class="combat-unit' + (ua.gold ? ' gold' : '') + '">' +
          abilityIcon(ua.ability) +
          '<span class="un">' + esc(unitName(ua)) + '</span>' +
          '<span class="us"><span class="atk">⚔' + ua.atk + '</span><span class="hp">♥' + ua.hp + '</span></span></div>';
      }
      html += '</div><div class="army-divider"></div><div class="army right">';
      if (!c.army_b.length) html += '<span class="combat-empty">армия уничтожена</span>';
      for (var bi = 0; bi < c.army_b.length; bi++) {
        var ub = c.army_b[bi];
        html += '<div class="combat-unit enemy' + (ub.gold ? ' gold' : '') + '">' +
          abilityIcon(ub.ability) +
          '<span class="un">' + esc(unitName(ub)) + '</span>' +
          '<span class="us"><span class="atk">⚔' + ub.atk + '</span><span class="hp">♥' + ub.hp + '</span></span></div>';
      }
      html += '</div></div>';
      if (c.done) {
        var wtxt = c.winner === 'a' ? 'Победил ' + aName :
                   c.winner === 'b' ? 'Победил ' + bName : 'Ничья';
        html += '<div class="combat-winner' + (c.winner === 'draw' ? ' draw' : '') + '">' + wtxt + '</div>';
      }
      html += '</div>';
    }
    html += '</section>';
    return html;
  }

  function renderResult() {
    if (STATE.phase !== 'result') return '';
    var html = '<section class="block"><header><h2>Итоги раунда ' + STATE.round + '</h2></header><div class="result-list">';
    for (var i = 0; i < (STATE.last_result || []).length; i++) {
      var r = STATE.last_result[i];
      var aN = esc(STATE.names[r.a]);
      var bN = r.b == null ? '—' : esc(STATE.names[r.b]);
      var cls = 'result-row';
      var txt;
      if (r.winner === 'draw') { cls += ' draw'; txt = 'ничья'; }
      else if (r.winner === 'a') { cls += ' win'; txt = aN + ' побеждает'; }
      else { cls += ' lose'; txt = bN + ' побеждает'; }
      html += '<div class="' + cls + '"><div class="result-people">' +
        '<span class="r-p1">' + aN + '</span><span class="r-vs">vs</span><span class="r-p1">' + bN + '</span>' +
        (r.ghost ? ' <span class="badge-me" style="background:rgba(167,139,250,.2);color:#c4b2ff;">призрак</span>' : '') +
        '</div><div>' + txt +
        (r.damage > 0 ? ' · <span class="result-dmg">−' + r.damage + ' HP</span>' : ' <span class="result-dmg zero">без урона</span>') +
        '</div></div>';
    }
    html += '</div></section>';
    return html;
  }

  function renderVictory() {
    if (STATE.phase !== 'end') return '';
    var w = STATE.winner;
    var isMe = (w === STATE.slot);
    var name = (w != null) ? esc(STATE.names[w]) : '—';
    return '<div class="victory"><div class="crown">' + (isMe ? '👑' : '🏆') + '</div>' +
      '<h2>' + (isMe ? 'Победа!' : 'Победитель: ' + name) + '</h2>' +
      '<div class="sub">' + (isMe ? 'Вы последний выживший в Arena Royale.' : 'Матч завершён.') + '</div></div>';
  }

  function renderPlayers() {
    var html = '<section class="block"><header><h2>Игроки</h2></header><div class="players-grid">';
    for (var i = 0; i < STATE.players.length; i++) {
      var p = STATE.players[i];
      var cls = 'player-card' + (i === STATE.slot ? ' me' : '') + (p.alive ? '' : ' dead');
      var hpPct = Math.max(0, Math.min(100, (p.hp / 20) * 100));
      html += '<div class="' + cls + '">' +
        '<div class="p-top"><span class="p-name">' + esc(p.name) +
          (i === STATE.slot ? '<span class="badge-me">вы</span>' : '') +
          (!p.alive ? '<span class="badge-dead">выбыл</span>' : '') +
        '</span></div>' +
        '<div class="p-hpbar"><div style="width:' + hpPct + '%"></div></div>' +
        '<div class="p-foot">' +
          '<span>♥ ' + p.hp + '</span>' +
          '<span>🍺 T' + p.tavern + '</span>' +
          '<span>👑 ' + esc(heroName(p.hero)) + '</span>' +
        '</div></div>';
    }
    html += '</div></section>';
    return html;
  }

  function render() {
    var root = document.getElementById('root');
    if (!STATE) { root.innerHTML = '<div class="lobby"><h2>Загрузка…</h2></div>'; return; }
    if (STATE.phase === 'no_game') { root.innerHTML = '<div class="lobby"><h2>Нет активной игры</h2></div>'; return; }
    if (STATE.phase === 'lobby') { root.innerHTML = renderLobby(); return; }
    var html = '';
    html += renderHeroAndStats();
    html += renderVictory();
    html += renderCombat();
    html += renderResult();
    html += renderShop();
    html += renderActionBar();
    html += renderHand();
    html += renderField();
    html += renderPlayers();
    root.innerHTML = html;
  }

  async function tick() {
    try {
      var r = await fetch('/ar/api/state', { credentials: 'same-origin' });
      if (r.status === 404) { goHome(); return; }
      var j = await r.json();
      if (!j.ok) { goHome(); return; }
      STATE = j.state;
      document.getElementById('roomCode').textContent = STATE.game_id || '—';
      render();
    } catch (e) {}
  }
  setInterval(tick, 1000);
  tick();
})();
</script>
</body>
</html>
